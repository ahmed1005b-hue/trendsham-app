name: trendsham
description: تطبيق تريندشام - سوق إلكتروني متعدد البائعين
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2
  file_picker: ^13.0.0
  url_launcher: ^6.3.3
  flutter_secure_storage: ^11.2.0
  pdf: ^3.10.7
  printing: ^5.11.1
  path_provider: ^2.1.2
  share_plus: ^13.3.1
  fl_chart: ^1.3.0
  animations: ^2.0.11
  animated_theme_switcher: ^2.0.10
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  app_settings: ^9.0.1
  geolocator: ^14.0.1
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/trendsham_icon_coral.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FF3B5C"
  adaptive_icon_foreground: "assets/icon/trendsham_icon_coral_fg.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FF3B5C"
  image: "assets/icon/trendsham_icon_coral_fg.png"
  android: true
  ios: false
  android_12:
    color: "#FF3B5C"
    image: "assets/icon/trendsham_icon_coral_fg.png"
dependency_overrides:
  archive: ^4.0.20

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
    - assets/l10n/
